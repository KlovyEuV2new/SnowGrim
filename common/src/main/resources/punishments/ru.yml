            - "TimerLimit"
            - "Weboffset"
            - "Offset"
            - "NoFall"
            - "Phase"
            - "FlightB"
            - "ElytraJ"
        commands:
            - "10:10 [alert]"
            - "20:20 [log]"
            - "20:10 [webhook]"
            - "20:10 [proxy]"
